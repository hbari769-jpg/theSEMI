<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" fill="none">
  <style>
    .mark-color { stroke: #000000; }
    .text-color { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .mark-color { stroke: #ffffff; }
      .text-color { fill: #ffffff; }
    }
  </style>

  <!-- Centered Aestific Emblem Mark -->
  <g transform="translate(100, 15) scale(1)">
    <path
      d="M 54 79.5 A 32 32 0 1 1 82 48 L 82 64 A 7.5 7.5 0 0 1 67 64 L 67 48 A 17 17 0 0 0 33 48 A 17 17 0 0 0 67 48"
      class="mark-color"
      stroke-width="6.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark "aestific" in lowercase, wide letter spacing -->
  <text
    x="150"
    y="160"
    text-anchor="middle"
    class="text-color"
    font-family="'Comfortaa', 'Outfit', sans-serif"
    font-size="34"
    font-weight="500"
    letter-spacing="9px"
  >aestific</text>
</svg>
